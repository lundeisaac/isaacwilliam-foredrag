media:
  input: assets/images
  output: /assets/images

content:
  - name: nettsidetekster
    label: "Nettsidens tekster og innstillinger"
    type: file
    path: _data/innhold.yml
    format: yaml
    fields:
      - { name: navn, label: "Navn", type: string, required: true }
      - { name: rolle, label: "Undertittel ved logoen", type: string }
      - { name: overtekst, label: "Forside: liten overskrift", type: string }
      - { name: forside_tittel, label: "Forside: stor overskrift", type: string }
      - { name: forside_intro, label: "Forside: introduksjon", type: text }
      - { name: forside_knapp, label: "Forside: booking-knapp", type: string }
      - { name: forside_sekundaerknapp, label: "Forside: foredrag-knapp", type: string }
      - { name: dekor_tittel, label: "Forside: tekst i dekorfeltet", type: text }
      - { name: hero_bilde, label: "Forside: stort bilde (valgfritt)", type: image }
      - { name: profilbilde, label: "Om meg: profilbilde (valgfritt)", type: image }
      - { name: foredrag_overtekst, label: "Foredrag: liten overskrift", type: string }
      - { name: foredrag_tittel, label: "Foredrag: overskrift", type: string }
      - { name: foredrag_intro, label: "Foredrag: introduksjon", type: text }
      - { name: ingen_foredrag_tittel, label: "Tekst når ingen foredrag er publisert: overskrift", type: string }
      - { name: ingen_foredrag_tekst, label: "Tekst når ingen foredrag er publisert: beskrivelse", type: text }
      - { name: om_overtekst, label: "Om meg: liten overskrift", type: string }
      - { name: om_tittel, label: "Om meg: overskrift", type: string }
      - { name: om_avsnitt_1, label: "Om meg: første avsnitt", type: text }
      - { name: om_avsnitt_2, label: "Om meg: andre avsnitt", type: text }
      - { name: kontakt_overtekst, label: "Kontakt: liten overskrift", type: string }
      - { name: kontakt_tittel, label: "Kontakt: overskrift", type: string }
      - { name: kontakt_tekst, label: "Kontakt: introduksjon", type: text }
      - { name: kontakt_knapp, label: "Kontakt: knappetekst", type: string }
      - { name: epost, label: "Planlagt e-postadresse", type: string }
      - { name: booking_overtekst, label: "Booking: liten overskrift", type: string }
      - { name: booking_tittel, label: "Booking: overskrift", type: string }
      - { name: booking_intro, label: "Booking: introduksjon", type: text }
      - name: booking_endepunkt
        label: "Booking: Formspree URL (bare når personvern er ferdig)"
        type: string
        description: "La feltet stå tomt til Formspree er opprettet, personvernteksten er fullført og du er klar for å motta forespørsler."
  - name: foredrag
    label: "Foredrag"
    type: collection
    path: _foredrag
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [tittel, synlig, maalgruppe, rekkefolge]
      primary: tittel
      sort: [rekkefolge, tittel]
    fields:
      - { name: tittel, label: "Tittel", type: string, required: true }
      - { name: ingress, label: "Kort beskrivelse", type: text, required: true }
      - { name: maalgruppe, label: "Målgruppe", type: string }
      - { name: varighet, label: "Varighet", type: string }
      - { name: synlig, label: "Vis på nettsiden", type: boolean, default: false }
      - { name: rekkefolge, label: "Rekkefølge", type: number, default: 10 }
      - { name: body, label: "Lang beskrivelse / notater (ikke vist på forsiden)", type: rich-text }
