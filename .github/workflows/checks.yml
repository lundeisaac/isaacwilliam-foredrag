name: Validate independent website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run staging:check
      - name: Validate independent server and staging configuration
        run: |
          APP_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
          APP_ENV_FILE=.env.example APP_PORT=3001 docker compose --env-file .env.example -p isaacwilliam-staging config --quiet
      - name: Build production image
        run: docker build --tag isaacwilliam-staging:${{ github.sha }} .
      - name: Smoke-test production image
        run: node scripts/container-smoke.mjs isaacwilliam-staging:${{ github.sha }}
